name: Epizyme
description: 'Epizyme, Inc. was a Cambridge, Massachusetts biopharmaceutical company
  developing epigenetic therapies for cancer and other diseases. Its lead product,
  TAZVERIK (tazemetostat), is an oral EZH2 inhibitor approved by the FDA for epithelioid
  sarcoma and relapsed/refractory follicular lymphoma. Epizyme was acquired by Ipsen
  in 2022. It was added to the API Evangelist network as a stub via the kleiner-perkins
  venture portfolio; the company operates no public developer program, API, or
  documentation surface, and its former corporate website (epizyme.com) is no longer
  serving a web presence though the domain remains registered and mail-active.'
